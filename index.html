<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MunchCheck</title>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-logo">MunchCheck</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="calculator.html">Budget</a>
        </div>
    </nav>

    <main>
        <h1>MunchCheck</h1>

        <div class="card">
            <div class="card-label">Current Budget</div>
            <div class="wallet-container">
                <div class="balance-display">
                    <p>Current Cash</p>
                    <h2 id="balance-amount">$0.00</h2>
                    <p id="credit-status">Credit Status: Ready to Munch</p>
                </div>
            </div>
            <div class="field">
                <label for="add-amount">Amount</label>
                <input type="number" id="add-amount" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="button-row">
                <button class="save-btn" id="add-money-btn">Add Money</button>
                <button class="save-btn withdraw-btn" id="withdraw-money-btn">Withdraw</button>
            </div>
        </div>

        <hr>

        <section id="munch-list">
            <h3>Available Munches</h3>
            <div id="food-container"></div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script type="module" src="animation.js"></script>
    <script src="script.js"></script>
</body>
</html>
