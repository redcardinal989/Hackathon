<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchCheck — Budget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-logo">MunchCheck</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="calculator.html">Budget</a>
        </div>
    </nav>

    <main>
        <h1>Budget Calculator</h1>
        <p>Calculate your available budget for food</p>
        
        <div class="card">
            <div class="card-label">Enter Your Budget</div>
            
            <div class="field">
                <label for="total-cash">Total Cash Available</label>
                <input type="number" id="total-cash" placeholder="0.00" step="0.01" min="0">
            </div>
            
            <div class="result-row">
                <div class="result-label">FOOD BUDGET</div>
                <div class="result-value" id="final-budget">$0.00</div>
            </div>
            
            <button class="save-btn" id="save-budget">Save Budget</button>
        </div>

        <div class="card">
            <div class="card-label">Remaining Budget This Week</div>
            <div class="chart-wrap">
                <div class="chart-controls">
                    <span id="chart-subtitle">No spending logged yet</span>
                    <button class="reset-btn" id="reset-chart">Reset</button>
                </div>
                <div class="bars" id="bars-container"></div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-dot past"></div>
                        Past days
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot current"></div>
                        Today
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
