<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchCheck — Budget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-logo">MunchCheck</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="calculator.html">Budget</a>
        </div>
    </nav>

    <main>
        <h1>Budget Calculator</h1>
        <p>Calculate your available budget for food</p>
        
        <div class="card">
            <div class="card-label">Enter Your Expenses</div>
            
            <div class="field">
                <label for="total-cash">Money Deposited</label>
                <input type="number" id="total-cash" placeholder="0.00" step="0.01">
            </div>
            
            <div class="result-row">
                <div class="result-label">FOOD BUDGET</div>
                <div class="result-value" id="final-budget">$0.00</div>
            </div>
            
            <button class="save-btn" id="save-budget">Save Budget</button>
        </div>

        <div class="card">
            <div class="card-label">Food Spent This Week</div>
            <div class="chart-wrap">
                <div class="chart-controls">
                    <span id="chart-subtitle">No spending logged yet</span>
                    <button class="reset-btn" id="reset-chart">Reset</button>
                </div>
                <div class="bars" id="bars-container"></div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-dot past"></div>
                        Past days
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot current"></div>
                        Today
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>


</main>

<div class="toast" id="toast"></div>

<script>
    const $ = id => document.getElementById(id);
    const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function getDayKey(date = new Date()) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function loadHistory() {
        try { return JSON.parse(localStorage.getItem('munchDailySpend') || '{}'); }
        catch { return {}; }
    }
    function saveHistory(h) { localStorage.setItem('munchDailySpend', JSON.stringify(h)); }

    function showToast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2600);
    }

    function calculate() {
        const val = parseFloat($('food-budget').value) || 0;
        $('final-budget').textContent = `$${val.toFixed(2)}`;
        return val;
    }
    $('food-budget').addEventListener('input', calculate);

    $('save-budget').addEventListener('click', () => {
        const budget = calculate();
        if (budget <= 0) { showToast('Enter a budget amount first.'); return; }

        localStorage.setItem('munchBudget', budget);

        const history = loadHistory();
        const todayKey = getDayKey();
        history[todayKey] = budget;
        saveHistory(history);

        renderChart();
        showToast(`Budget saved! You can spend $${budget.toFixed(2)} on food.`);
        setTimeout(() => { window.location.href = 'index.html'; }, 1800);
    });

    function renderChart() {
        const history = loadHistory();
        const now = new Date();

        const days = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(now.getDate() - i);
            days.push({ key: getDayKey(d), label: DAYS[d.getDay()], isToday: i === 0 });
        }

        const values = days.map(d => history[d.key] || 0);
        const max = Math.max(...values, 1);
        const weekTotal = values.reduce((a, b) => a + b, 0);

        $('chart-subtitle').textContent = weekTotal > 0
            ? `$${weekTotal.toFixed(2)} budgeted this week`
            : 'Save a budget to start tracking';

        const container = $('bars-container');
        container.innerHTML = '';

        days.forEach(({ key, label, isToday }) => {
            const amount = history[key] || 0;
            const pct = (amount / max) * 100;

            const col = document.createElement('div');
            col.className = 'bar-col';
            col.innerHTML = `
                <div class="bar-amount">${amount > 0 ? '$' + amount.toFixed(0) : ''}</div>
                <div class="bar-track">
                    <div class="bar-fill ${isToday ? 'today' : ''}" style="height:0%"></div>
                </div>
                <div class="bar-day ${isToday ? 'today-label' : ''}">${label}</div>
            `;
            container.appendChild(col);

            requestAnimationFrame(() => requestAnimationFrame(() => {
                col.querySelector('.bar-fill').style.height = pct + '%';
            }));
        });
    }

    $('reset-chart').addEventListener('click', () => {
        if (confirm("Clear this week's spending history?")) {
            localStorage.removeItem('munchDailySpend');
            renderChart();
            showToast('History cleared.');
        }
    });

    calculate();
    renderChart();
</script>

</body>
</html>
